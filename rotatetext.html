    <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Переверни текст</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #7ef29d;
      margin-bottom: 20px;
    }
    input {
      padding: 10px;
      width: 250px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #7ef29d;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    p {
      margin-top: 20px;
      font-size: 18px;
      color: #fff;
    }
    a {
      margin-top: 40px;
      color: #7ef29d;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Переверни текст</h1>
  <input type="text" id="textInput" placeholder="Введите текст">
  <button onclick="reverseText()">Перевернуть</button>
  <p id="result"></p>
  <a href="index.html">⬅ На главную</a>

</body>
</html>

    <script src="rotatetext.js"></script>
</body>
</html>
